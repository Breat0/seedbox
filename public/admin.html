<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>种子盲盒 · 管理后台</title>
<style>
  :root{--green:#2E6B4F;--green-d:#1F4E38;--gold:#D9A441;--cream:#FBF7EC;--ink:#2B2B2B;--grey:#8A8276;--red:#B5342A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 50px}
  h1{font-size:22px;margin:0 0 4px;font-family:"STKaiti","KaiTi",serif;color:var(--green-d)}
  .sub{font-size:12px;color:var(--grey);margin-bottom:18px}
  .card{background:#fff;border:1px solid rgba(217,164,65,.35);border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(46,107,79,.06);margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input,select{padding:10px 12px;border-radius:10px;border:1px solid #E6DFCF;background:#FDFBF4;font-size:14px;outline:none}
  input:focus{border-color:var(--gold);background:#fff}
  button{padding:10px 18px;border-radius:10px;border:none;background:var(--green);color:#fff;font-size:14px;cursor:pointer}
  button.ghost{background:#fff;color:var(--green-d);border:1px solid var(--gold)}
  button.danger{background:#fff;color:var(--red);border:1px solid #E8B9B3}
  button:disabled{opacity:.55}
  .stats{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px}
  .stat{background:#FDFBF4;border:1px solid #EFE8D8;border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:20px;color:var(--green-d)}
  .stat span{font-size:12px;color:var(--grey)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 8px;border-bottom:1px solid #F0EADB;text-align:left;white-space:nowrap}
  th{background:#F7F2E4;color:#6B6355;font-weight:600;position:sticky;top:0}
  tr:hover td{background:#FDFBF4}
  .tablebox{max-height:460px;overflow:auto;border-radius:12px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#F3EDDD;color:#8A6B22;font-size:12px}
  .hide{display:none}
  .tip{font-size:12px;color:var(--grey);margin-top:8px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>种子盲盒 · 管理后台</h1>
  <div class="sub">声耀七十载 · 金话颂北农 ｜ 数据保存在服务器 data/draws.json，可随时导出</div>

  <!-- 登录 -->
  <div class="card" id="loginCard">
    <div class="row">
      <input id="pwd" type="password" placeholder="管理口令" style="min-width:220px">
      <button id="loginBtn">登录</button>
    </div>
    <div class="tip">默认口令 bua2026，登录后可在下方修改。忘记口令请打开 config.json 查看。</div>
  </div>

  <!-- 面板 -->
  <div id="panel" class="hide">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div style="font-size:15px;font-weight:600">抽取总览</div>
        <div class="row">
          <button class="ghost" id="refreshBtn">刷新</button>
          <a id="exportLink" href="#"><button class="ghost">导出 CSV</button></a>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="tip">每阶配额当前为 <b id="quotaTxt">-</b>；六阶同时抽满即自动停止发放。</div>
    </div>

    <div class="card">
      <div class="row">
        <span style="font-size:14px">每阶配额</span>
        <input id="quotaInput" type="number" min="1" max="200" style="width:110px">
        <button id="quotaBtn">保存配额</button>
        <span style="flex:1"></span>
        <input id="newPwd" type="password" placeholder="新口令（至少4位）" style="min-width:180px">
        <button class="ghost" id="pwdBtn">修改口令</button>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <input id="kw" placeholder="搜索姓名 / 学号 / 班级 / 阶段" style="min-width:260px">
        <span style="font-size:13px;color:var(--grey)">共 <b id="total">0</b> 条</span>
      </div>
      <div class="tablebox" style="margin-top:12px">
        <table>
          <thead><tr><th>#</th><th>抽取时间</th><th>姓名</th><th>学号</th><th>班级</th><th>阶段</th><th>生长步</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <span style="font-size:14px;color:var(--red)">危险操作：</span>
        <input id="resetInput" placeholder="输入 RESET 确认清空" style="min-width:200px">
        <button class="danger" id="resetBtn">清空全部抽取数据</button>
      </div>
      <div class="tip">清空前请先导出 CSV 备份。清空只影响抽取记录，不影响配额与口令。</div>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var token = sessionStorage.getItem('seedbox_admin_token') || '';
  var stages = [];
  var rows = [];

  function api(path, opt) {
    return fetch(path, opt).then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
  }
  function post(path, data) {
    return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  }

  function login() {
    var pwd = $('pwd').value.trim();
    if (!pwd) return;
    post('/api/admin/login', { password: pwd }).then(function (res) {
      if (res.status === 200) {
        token = res.body.token;
        sessionStorage.setItem('seedbox_admin_token', token);
        $('loginCard').classList.add('hide');
        $('panel').classList.remove('hide');
        load();
      } else {
        alert(res.body.error || '口令不正确');
      }
    });
  }

  function render() {
    var kw = $('kw').value.trim();
    var list = rows.filter(function (d) {
      if (!kw) return true;
      return (d.name + d.sid + (d.cls || '') + d.stageName).indexOf(kw) >= 0;
    });
    $('total').textContent = list.length;
    $('tbody').innerHTML = list.slice().reverse().map(function (d) {
      var t = new Date(d.ts);
      var p = function (n) { return String(n).padStart(2, '0'); };
      var time = t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate()) + ' ' + p(t.getHours()) + ':' + p(t.getMinutes());
      return '<tr><td>' + d.id + '</td><td>' + time + '</td><td>' + d.name + '</td><td>' + d.sid +
        '</td><td>' + (d.cls || '') + '</td><td><span class="pill">' + d.stageName + '</span></td><td>第 ' + d.step + ' 步</td></tr>';
    }).join('');
  }

  function load() {
    api('/api/admin/data?token=' + encodeURIComponent(token)).then(function (res) {
      if (res.status !== 200) { alert('登录已过期，请刷新页面重新登录'); return; }
      rows = res.body.draws || [];
      stages = res.body.stages || [];
      var stats = res.body.stats || {};
      var html = '<div class="stat"><b>' + rows.length + '</b><span>总抽取</span></div>';
      stages.forEach(function (s) {
        html += '<div class="stat"><b>' + (stats[s.no] || 0) + '</b><span>' + s.name + '</span></div>';
      });
      $('stats').innerHTML = html;
      $('quotaTxt').textContent = res.body.config.perStageQuota;
      $('quotaInput').value = res.body.config.perStageQuota;
      $('exportLink').href = '/api/admin/export?token=' + encodeURIComponent(token);
      render();
    });
  }

  $('loginBtn').addEventListener('click', login);
  $('pwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  $('refreshBtn').addEventListener('click', load);
  $('kw').addEventListener('input', render);
  $('quotaBtn').addEventListener('click', function () {
    post('/api/admin/config', { token: token, perStageQuota: Number($('quotaInput').value) }).then(function (res) {
      if (res.status === 200) { alert('配额已更新为 ' + res.body.config.perStageQuota + (res.body.note ? '\n\n' + res.body.note : '')); load(); }
      else alert(res.body.error || '保存失败');
    });
  });
  $('pwdBtn').addEventListener('click', function () {
    var v = $('newPwd').value.trim();
    if (v.length < 4) { alert('口令至少 4 位'); return; }
    post('/api/admin/config', { token: token, password: v }).then(function (res) {
      if (res.status === 200) { alert('口令已修改' + (res.body.note ? '\n\n' + res.body.note : '')); $('newPwd').value = ''; }
      else alert(res.body.error || '修改失败');
    });
  });
  $('resetBtn').addEventListener('click', function () {
    if ($('resetInput').value.trim() !== 'RESET') { alert('请输入 RESET 确认'); return; }
    if (!confirm('确定清空全部抽取记录？建议先导出 CSV。')) return;
    post('/api/admin/reset', { token: token, confirm: 'RESET' }).then(function (res) {
      if (res.status === 200) { alert('已清空'); $('resetInput').value = ''; load(); }
      else alert(res.body.error || '清空失败');
    });
  });

  if (token) {
    api('/api/admin/data?token=' + encodeURIComponent(token)).then(function (res) {
      if (res.status === 200) {
        $('loginCard').classList.add('hide');
        $('panel').classList.remove('hide');
        rows = res.body.draws || []; stages = res.body.stages || [];
        load();
      }
    });
  }
})();
</script>
</body>
</html>
